<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/lab-base.css">
    <script src="../js/lab-ui.js"></script>
    <title>발포비타민 필름통 로켓 (가족 행사)</title>
    <link rel="stylesheet" href="../css/class-share.css">
    <link rel="stylesheet" href="../css/film-rocket.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
</head>
<body class="ev-body">
<!-- 행사형 화면 (AGENTS.md UI 규칙): 한 화면에 한 가지 일, 큰 단추, '다음'으로 넘기기. 폰 한 대가 측정·결과를 다 함 -->
<header class="ev-top" id="ev-top" hidden>
    <div class="ev-top-row">
        <span id="ev-team" class="ev-team"></span>
        <span id="ev-score" class="ev-score" aria-label="팀 점수"></span>
    </div>
    <nav class="ev-stages" id="ev-stages" aria-label="단계"></nav>
    <p id="ev-sync" class="ev-sync" role="status" aria-live="polite" hidden></p>
    <p id="ev-flash" class="ev-flash" role="status" aria-live="assertive" hidden></p>
    <div id="ev-notice" class="ev-notice" role="status" aria-live="polite" hidden></div>
</header>

<main class="ev-wrap">
    <!-- 📶 연결이 끊겼을 때만 (다시 연결되면 저절로 사라짐) -->
    <div id="ev-offline" class="ev-offline" role="alert" hidden></div>
    <div id="ev-app" class="ev-app" aria-live="polite"></div>

    <details class="ev-more ev-foot">
        <summary>🏫 선생님 연결 · 도움말</summary>
        <div id="class-bar"></div>
        <p class="ev-small">이 화면은 <b>이 폰에 먼저 저장</b>돼요. 인터넷이 끊겨도 계속할 수 있고, 연결되면 선생님 화면으로 저절로 보내요.
            보내는 것: 팀 이름, 퀴즈 점수, 잰 시간·높이(아이 키의 %), 고른 답. <b>영상과 아이 키(cm)는 보내지 않아요.</b></p>
        <p class="ev-small"><a href="../index.html">← 메인 페이지</a></p>
    </details>
</main>

<script src="../js/pendulum-config.js"></script>
<script src="../js/pendulum-cloud.js"></script>
<script src="../js/lab-store.js"></script>
<script src="../js/class-cloud.js"></script>
<script src="../js/class-share.js"></script>
<script src="../js/film-rocket-math.js"></script>
<script src="../js/film-rocket-video.js"></script>
<script src="../js/film-rocket.js"></script>
</body>
</html>
