<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문항 출제용 그림·그래프 — 새 주소로 옮김</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 16px; line-height: 1.6; color: #222; background: #fff; }
        a.go { display: inline-block; margin: 1rem 0; padding: .7rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .note { color: #555; font-size: .92rem; }
    </style>
</head>
<body>
    <h1>✏️ 문항 출제용 그림·그래프</h1>
    <p>이 도구는 <b>새 주소</b>로 옮겼습니다. 잠시 뒤 자동으로 이동합니다.</p>
    <p><a class="go" id="go" href="https://aks-sci-lab.github.io/figure-maker/">새 주소로 가기</a></p>
    <p class="note" id="moved" hidden>이 브라우저에 자동 저장돼 있던 그림도 함께 가져갑니다.</p>
    <p class="note">AI 그리기의 API 키·LM Studio 설정은 옮겨지지 않으니 새 주소에서 한 번 다시 넣어 주세요. 새 주소: https://aks-sci-lab.github.io/figure-maker/</p>
<script>
// 자동 저장된 그림을 주소 # 뒤에 담아 넘김 (# 뒤는 서버로 보내지지 않음). 형식은 새 저장소의 FigureModel.decodeMoved 와 같음
(function () {
    'use strict';
    const go = document.getElementById('go');
    let saved = null;
    try { saved = localStorage.getItem('figure-maker-scene'); } catch (e) { saved = null; }
    if (saved) {
        try {
            JSON.parse(saved);
            let bin = '';
            new TextEncoder().encode(saved).forEach(b => { bin += String.fromCharCode(b); });
            go.href += '#move=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            document.getElementById('moved').hidden = false;
        } catch (e) { /* 깨진 자료는 넘기지 않음 */ }
    }
    setTimeout(() => location.replace(go.href), 2500);
})();
</script>
</body>
</html>
