<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="자유낙하 궤적 분석 & 다중섬광사진 - 수동 객체 선택 방식">
    <title>자유낙하 다중섬광사진 및 수동 궤적 분석</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Base layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        h2 { color: #555; margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        /* Tabs */
        .tabs { margin-bottom: 12px; text-align: left; }
        .tab-buttons { display:flex; gap:8px; justify-content:flex-start; margin-bottom:8px; }
        .tab-btn { padding:8px 14px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer; }
        .tab-btn.active { background:#007bff; color:white; border-color:#007bff; }

        .controls, .slider-controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }

        input[type="file"] {
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .control-group input[type="number"] {
            width: 70px;
            padding: 6px;
            font-size: 15px;
            text-align: center;
        }

        .control-group input[type="range"] { cursor: pointer; }

        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }

        #btn-manual-track { background-color: #dc3545; display: none; }
        #btn-manual-track:hover { background-color: #c82333; }
        #btn-strobo { background-color: #6f42c1; display: none; }
        #btn-strobo:hover { background-color: #5a32a3; }
        #btn-undo-point { background-color: #fd7e14; display: none; }
        #btn-undo-point:hover { background-color: #e86c00; }
        #btn-clear-points { background-color: #ffc107; color: #333; display: none; }
        #btn-clear-points:hover { background-color: #ffb800; }

        #video-container { position: relative; display: inline-block; margin: 20px 0; width: 100%; }

        canvas {
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #fff;
            width: 100%;
            height: auto;
            cursor: crosshair;
            display: block;
            touch-action: none;
        }

        video { display: none; }

        #status-msg {
            font-size: 1.05em;
            font-weight: bold;
            color: #d35400;
            margin: 15px 0;
            padding: 10px;
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
        }

        .chart-container { width: 100%; max-width: 900px; margin: 0 auto; display: none; margin-top: 20px; }

        #loading-overlay { display: none; color: #28a745; font-weight: bold; margin-top: 10px; }

        .notice { font-size: 0.95em; color: #666; margin-top: 10px; padding: 10px; background-color: #e7f3ff; border-left: 4px solid #2196F3; border-radius: 4px; }

        #tracking-info { font-size: 1em; color: #28a745; font-weight: bold; margin-top: 10px; padding: 8px; background-color: #d4edda; border-left: 4px solid #28a745; border-radius: 4px; display: none; }

        #strobo-container { display: none; width: 100%; margin-top: 20px; }

        .frame-nav { margin: 10px 0 15px 0; display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; background-color: #f1f3f5; padding: 10px; border-radius: 6px; font-size: 0.95em; }
        .frame-nav button { padding: 6px 12px; font-size: 13px; min-width: 50px; }
        .frame-nav input { width: 60px; padding: 6px; font-size: 13px; text-align: center; }
        .frame-nav span { font-size: 13px; font-weight: bold; }

        /* Zoom overlay */
        .zoom-overlay { position: fixed; right: 16px; top: 80px; width: 220px; height: 220px; border: 2px solid #333; border-radius: 8px; background: #fff; z-index: 9999; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

        /* Responsive rules */
        @media (max-width: 720px) {
            body { padding: 12px; }
            .container { padding: 12px; border-radius: 8px; }
            .controls, .slider-controls { padding: 10px; gap: 8px; }
            .tab-buttons { gap:6px; }
            .tab-btn { padding:8px 10px; font-size:14px; }
            .chart-container { max-width: 100%; }
            canvas { border-width: 1px; }
            #projectile-charts { grid-template-columns: 1fr !important; }
        }

        @media (min-width: 1024px) {
            body { padding: 28px; }
            .container { max-width: 1000px; margin: 0 auto; }
            .tab-buttons { justify-content:flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>자유낙하 및 2차원 운동 분석</h1>
        <p>물체의 중심을 직접 선택하거나, 모바일 확대 선택을 사용해 더 정확하게 측정하세요.</p>

        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="free-fall">자유낙하</button>
                <button class="tab-btn" data-tab="projectile">2차원 운동</button>
            </div>
        </div>

        <!-- 단계 1: 영상 로드 -->
        <div class="controls">
            <input type="file" id="video-upload" accept="video/*">
            <div class="control-group">
                <label for="fps-input">영상 FPS:</label>
                <input type="number" id="fps-input" value="30" min="1" max="240">
            </div>
            <button id="btn-extract">영상 로드 및 추출</button>
            <button id="btn-reset">🔄 초기화</button>
        </div>

        <div id="status-msg">1단계: 동영상 파일을 선택하고 '영상 로드 및 추출'을 누르세요.</div>
        <div id="loading-overlay">영상을 추출하고 있습니다... <span id="progress-text"></span></div>

        <!-- 단계 2: 프레임 네비게이션 및 물체 선택 -->
        <div class="slider-controls" id="track-controls" style="display:none;">
            <div class="control-group">
                <label for="step-slider">다중섬광 프레임 간격:</label>
                <input type="range" id="step-slider" min="1" max="15" value="2">
                <span id="step-val">2</span>
            </div>
            <div class="control-group">
                <label for="pixel-to-mm">픽셀→실제 길이:</label>
                <input type="number" id="pixel-to-mm" value="1" step="0.01" min="0.01">
                <span>mm/px</span>
            </div>
            <button id="btn-manual-track">수동 선택 시작</button>
            <button id="btn-strobo" style="background-color: #28a745;">✓ 합성 실행</button>
            <button id="btn-csv" style="display:none; background-color: #28a745;">📊 CSV 다운로드</button>
        </div>

        <div id="tracking-info">선택된 점: <span id="selected-count">0</span>개</div>
        <div class="notice">※ 캔버스 위의 물체 중심을 클릭하여 선택하세요. 모바일에서는 길게 눌러 확대 선택이 가능합니다.</div>

        <!-- 비디오 및 캔버스 -->
        <div id="video-container">
            <video id="video" playsinline preload="auto"></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <div class="zoom-overlay" id="zoom-overlay" style="display:none;">
                <canvas id="zoom-canvas" width="220" height="220"></canvas>
            </div>
        </div>

        <!-- 프레임 네비게이션 (canvas 바로 아래) -->
        <div class="frame-nav" id="frame-nav-controls" style="display:none;">
            <button id="btn-prev-frame">⬅️ 이전</button>
            <div>
                <label for="frame-input">프레임:</label>
                <input type="number" id="frame-input" value="1" min="1">
            </div>
            <span id="frame-total">/ 0</span>
            <button id="btn-next-frame">다음 ➡️</button>
            <button id="btn-undo-point">↩️ 취소</button>
            <button id="btn-clear-points">🗑️ 초기화</button>
        </div>

        <!-- 합성된 다중섬광사진 -->
        <div id="strobo-container">
            <h2>합성된 다중섬광사진</h2>
            <canvas id="canvas-strobo"></canvas><br>
            <button id="btn-download-strobo" style="margin-top: 10px; background-color: #17a2b8;">🖼️ 사진 다운로드</button>
        </div>

        <!-- 자유낙하/2차원 운동 그래프 -->
        <div class="chart-container" id="chart-wrapper">
            <h2 id="chart-title">자유낙하 t-y 그래프</h2>
            <canvas id="chart"></canvas>
        </div>

        <!-- 2차원 운동 3개 그래프 -->
        <div class="chart-container" id="projectile-charts" style="display:none;">
            <h2>2차원 운동 분석</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
                <div>
                    <h3>X-t 그래프</h3>
                    <canvas id="chart-x-t"></canvas>
                </div>
                <div>
                    <h3>Y-t 그래프</h3>
                    <canvas id="chart-y-t"></canvas>
                </div>
            </div>
            <div>
                <h3>Y-X 궤적 (궤적)</h3>
                <canvas id="chart-y-x"></canvas>
            </div>
        </div>
    </div>

    <script src="../js/free-fall-manual.js" defer></script>
</body>
</html>
